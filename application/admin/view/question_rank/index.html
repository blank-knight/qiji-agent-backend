<div class="panel panel-default panel-intro">

    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">
                    <div id="toolbar" class="toolbar">
                         
                        {:build_toolbar('refresh,del')} 
                           
                    </div>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           data-operate-edit="question_rank/edit"
                            data-operate-del="question_rank/del"
                           width="100%">
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<input type="hidden" class="ids" value="{$ids}" name="">

<script src="__CDN__/user_assets/layui/jquery-3.7.1.js?v={$Think.config.site.version}"></script>
<script type="text/javascript">
    function del_all(type_id){
        if(confirm("选择全部删除后，该分类的数据不可恢复，您确认全部删除吗？")){
            $.post('/user/question_rank/del_all',{type_id:type_id},function(data){
                layer.msg(data.msg);
                document.location.reload();
            },'json');
        }
    }
</script>
