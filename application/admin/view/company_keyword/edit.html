

<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {:token()}
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">主词:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-keyword" class="form-control" name="row[keyword]" data-rule="required" type="text" placeholder="主词" value="{$row.keyword}" {if $is_edit_rule==0}disabled{/if}>
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">目标转化词:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-hit_word" class="form-control" name="row[hit_word]" data-rule="required" type="text" placeholder="目标转化词" value="{$row.hit_word}" {if $is_edit_rule==0}disabled{/if}>
        </div>
    </div>


    <div class="form-group mode2_block"  >
        <label class="control-label col-xs-12 col-sm-2">训练状态:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[status]', ['1'=>'开启优化','2'=>'关闭优化'],$row['status'])}
        </div>
    </div>


    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>

<script src="__CDN__/user_assets/layui/jquery-3.7.1.js?v={$Think.config.site.version}"></script>
<script type="text/javascript">
    $(document).on('change', "input[name='row[mode]']", function() {
        var selectedValue = $(this).val(); // 获取选中的值
        // 根据选中的值进行逻辑处理
        if (selectedValue === '1') {
            $('.mode2_block').hide();
        } else if (selectedValue === '2') {
            $('.mode2_block').show();
        }
    });
</script>
