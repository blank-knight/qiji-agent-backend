<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {:token()}

    <div class="form-group">
        <label for="c-name" class="control-label col-xs-12 col-sm-2"><i class="red_color" style="color:red">*</i>代理名称:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-name" data-rule="required" class="form-control" name="row[name]" type="text" value="" placeholder="代理名称">
        </div>
    </div>

    <div class="form-group">
        <label for="c-mobile" class="control-label col-xs-12 col-sm-2">手机号码:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-mobile" data-rule="mobile" class="form-control" name="row[mobile]" type="text" value="" placeholder="手机号码">
        </div>
    </div>

    <div class="form-group">
        <label for="c-domain" class="control-label col-xs-12 col-sm-2">代理网址:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-domain" class="form-control" name="row[domain]" type="text" value="" placeholder="如 https://agent.example.com">
            <p style="margin-top: 5px;font-size: 12px;color:#888;">该代理专属的客户端下载/推广网址</p>
        </div>
    </div>

    <div class="form-group">
        <label for="c-agent_id" class="control-label col-xs-12 col-sm-2">上级代理ID:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-agent_id" class="form-control" name="row[agent_id]" type="number" value="0" placeholder="0表示总后台">
            <p style="margin-top: 5px;font-size: 12px;color:#888;">0是总后台的，填写其他则是其他代理的下级</p>
        </div>
    </div>

    <div class="form-group">
        <label for="c-score" class="control-label col-xs-12 col-sm-2"><i class="red_color" style="color:red">*</i>积分/点数:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-score" data-rule="required" class="form-control" name="row[score]" type="number" value="0" placeholder="积分/点数">
        </div>
    </div>

    <div class="form-group">
        <label for="c-api_key" class="control-label col-xs-12 col-sm-2">API Key:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-api_key" class="form-control" name="row[api_key]" type="text" value="" placeholder="留空使用系统默认Key">
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">API Key模式:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[is_custom_key]', ['0'=>'使用上级API Key','1'=>'自定义API Key'], 0)}
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[status]', ['normal'=>__('Normal'), 'hidden'=>'关闭'], 'normal')}
        </div>
    </div>

    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
