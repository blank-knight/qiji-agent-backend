<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {:token()}

    {if condition="$isSuperAdmin"}
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2"><i style="color:red">*</i>类型:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[type]', ['tiepai'=>'贴牌商', 'agent'=>'代理'], 'tiepai')}
            <p style="margin-top:5px;font-size:12px;color:#888;">贴牌商可以开下级代理，代理只能管理用户</p>
        </div>
    </div>
    {/if}

    <div class="form-group" id="parent-group" style="display:none;">
        <label for="c-agent_id" class="control-label col-xs-12 col-sm-2">上级贴牌商:</label>
        <div class="col-xs-12 col-sm-4">
            <select id="c-agent_id" class="form-control selectpicker" name="row[agent_id]">
                {volist name="parentOptions" id="name" key="id"}
                <option value="{$id}" {in name="id" value="0"}selected{/in}>{$name}</option>
                {/volist}
            </select>
            <p style="margin-top:5px;font-size:12px;color:#888;">选择该代理所属的贴牌商</p>
        </div>
    </div>

    <div class="form-group">
        <label for="c-username" class="control-label col-xs-12 col-sm-2"><i style="color:red">*</i>登录账号:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-username" data-rule="required" class="form-control" name="row[username]" type="text" value="" placeholder="登录后台用">
        </div>
    </div>

    <div class="form-group">
        <label for="c-name" class="control-label col-xs-12 col-sm-2"><i style="color:red">*</i>名称:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-name" data-rule="required" class="form-control" name="row[name]" type="text" value="" placeholder="显示名称">
        </div>
    </div>

    <div class="form-group">
        <label for="c-password" class="control-label col-xs-12 col-sm-2"><i style="color:red">*</i>密码:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-password" data-rule="required" class="form-control" name="row[password]" type="password" value="" placeholder="后台登录密码">
        </div>
    </div>

    <div class="form-group">
        <label for="c-mobile" class="control-label col-xs-12 col-sm-2">手机号码:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-mobile" data-rule="mobile" class="form-control" name="row[mobile]" type="text" value="" placeholder="手机号码">
        </div>
    </div>

    <div class="form-group">
        <label for="c-domain" class="control-label col-xs-12 col-sm-2">代理网址:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-domain" class="form-control" name="row[domain]" type="text" value="" placeholder="如 https://agent.example.com">
            <p style="margin-top:5px;font-size:12px;color:#888;">该代理专属的客户端下载/推广网址</p>
        </div>
    </div>

    <div class="form-group">
        <label for="c-score" class="control-label col-xs-12 col-sm-2">积分/点数:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-score" class="form-control" name="row[score]" type="number" value="0" placeholder="积分/点数">
        </div>
    </div>



    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">API配置:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="radio">
                <label><input type="radio" name="row[api_mode]" value="inherit" checked> 使用上级API Key（默认，无需配置）</label>
            </div>
            <div class="radio">
                <label><input type="radio" name="row[api_mode]" value="custom"> 由我指定 —— 替其配置API地址与密钥</label>
            </div>
            <div id="api-custom-fields" style="margin:0 0 10px 20px;display:none;">
                <div class="form-group" style="margin-bottom:8px;">
                    <label class="control-label col-xs-12 col-sm-3" style="text-align:left;">API地址:</label>
                    <div class="col-xs-12 col-sm-8">
                        <input class="form-control" name="row[base_url]" type="text" value="" placeholder="如 https://api.example.com/v1">
                    </div>
                </div>
                <div class="form-group" style="margin-bottom:8px;">
                    <label class="control-label col-xs-12 col-sm-3" style="text-align:left;">API Key:</label>
                    <div class="col-xs-12 col-sm-8">
                        <input class="form-control" name="row[api_key]" type="text" value="" placeholder="留空使用系统默认Key">
                    </div>
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label class="control-label col-xs-12 col-sm-3" style="text-align:left;">可用模型:</label>
                    <div class="col-xs-12 col-sm-8">
                        <input class="form-control" name="row[models]" type="text" value="" placeholder="逗号分隔，如 gpt-4o,gpt-4o-mini；留空不限制">
                    </div>
                </div>
            </div>
            {if $canGrantModelConfig}
            <div class="radio">
                <label><input type="radio" name="row[api_mode]" value="self"> 允许其自行配置 —— 该账号后台会出现「大模型配置」菜单，由其自填</label>
            </div>
            {/if}
        </div>
    </div>


    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[status]', ['normal'=>__('Normal'), 'hidden'=>'关闭'], 'normal')}
        </div>
    </div>

    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>

<script>
// API配置三选一：切「由我指定」展开三栏（原生JS，不依赖jQuery/无缓存问题）
(function () {
    function toggle() {
        var v = document.querySelector('input[name="row[api_mode]"]:checked');
        var box = document.getElementById('api-custom-fields');
        if (box) box.style.display = (v && v.value === 'custom') ? '' : 'none';
    }
    document.addEventListener('change', function (e) {
        if (e.target && e.target.name === 'row[api_mode]') toggle();
    });
    toggle();
})();
</script>

<script>
$(function(){
    // 类型切换时显示/隐藏上级选择
    function toggleParent() {
        var type = $('input[name="row[type]"]:checked').val();
        if (type === 'agent') {
            $('#parent-group').show();
        } else {
            $('#parent-group').hide();
            $('#c-agent_id').val(0);
        }
    }
    $('input[name="row[type]"]').on('change', toggleParent);
    toggleParent();
});
</script>
