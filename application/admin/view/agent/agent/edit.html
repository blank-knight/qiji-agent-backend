<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {:token()}
    <input type="hidden" name="row[id]" value="{$row.id}">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">类型:</label>
        <div class="col-xs-12 col-sm-4">
            <input class="form-control" type="text" value="{$row.type_text}" readonly disabled>
            <p style="margin-top:5px;font-size:12px;color:#888;">类型创建后不可更改</p>
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">登录账号:</label>
        <div class="col-xs-12 col-sm-4">
            <input class="form-control" type="text" value="{$row.username}" readonly disabled>
        </div>
    </div>

    <div class="form-group">
        <label for="c-name" class="control-label col-xs-12 col-sm-2"><i style="color:red">*</i>名称:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-name" data-rule="required" class="form-control" name="row[name]" type="text" value="{$row.name}">
        </div>
    </div>

    <div class="form-group">
        <label for="c-password" class="control-label col-xs-12 col-sm-2">重置密码:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-password" class="form-control" name="row[password]" type="password" value="" placeholder="留空不修改">
        </div>
    </div>

    <div class="form-group">
        <label for="c-mobile" class="control-label col-xs-12 col-sm-2">手机号码:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-mobile" data-rule="mobile" class="form-control" name="row[mobile]" type="text" value="{$row.mobile}" placeholder="手机号码">
        </div>
    </div>

    <div class="form-group">
        <label for="c-domain" class="control-label col-xs-12 col-sm-2">代理网址:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-domain" class="form-control" name="row[domain]" type="text" value="{$row.domain}" placeholder="如 https://agent.example.com">
            <p style="margin-top:5px;font-size:12px;color:#888;">该代理专属的客户端下载/推广网址</p>
        </div>
    </div>

    <div class="form-group">
        <label for="c-score" class="control-label col-xs-12 col-sm-2">积分/点数:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-score" class="form-control" name="row[score]" type="number" value="{$row.score}" placeholder="积分/点数">
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">API配置:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="radio">
                <label for="api-mode-inherit"><input type="radio" name="row[api_mode]" id="api-mode-inherit" value="inherit" {if $api_mode == 'inherit'}checked{/if}> 使用上级API Key（默认，无需配置）</label>
            </div>
            {if $canGrantModelConfig}
            <div class="radio">
                <label for="api-mode-self"><input type="radio" name="row[api_mode]" id="api-mode-self" value="self" {if $api_mode == 'self'}checked{/if}> 允许其自行配置 —— 该{if $row.type == 'tiepai'}贴牌商及其代理{else}代理{/if}后台会出现「大模型配置」菜单，由其自填</label>
            </div>
            {/if}
            <p style="margin-top:5px;font-size:12px;color:#888;">开启后其后台出现「大模型配置」菜单；关闭则收回菜单并回落使用上级配置</p>
        </div>
    </div>


    {if $canSetEpay}
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">在线收款(易支付):</label>
        <div class="col-xs-12 col-sm-8">
            <p style="margin-top:5px;font-size:12px;color:#888;">配置后，其名下用户购买套餐时款项直接进入此账户；留空则沿用上级配置</p>
            <div class="form-group" style="margin-bottom:8px;">
                <label class="control-label col-xs-12 col-sm-3" style="text-align:left;">网关地址:</label>
                <div class="col-xs-12 col-sm-8">
                    <input class="form-control" name="row[epay_url]" type="text" value="{$row.epay_url}" placeholder="如 https://pay.example.com">
                </div>
            </div>
            <div class="form-group" style="margin-bottom:8px;">
                <label class="control-label col-xs-12 col-sm-3" style="text-align:left;">商户ID:</label>
                <div class="col-xs-12 col-sm-8">
                    <input class="form-control" name="row[epay_pid]" type="text" value="{$row.epay_pid}" placeholder="易支付商户ID">
                </div>
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <label class="control-label col-xs-12 col-sm-3" style="text-align:left;">商户密钥:</label>
                <div class="col-xs-12 col-sm-8">
                    <input class="form-control" name="row[epay_key]" type="text" value="{$row.epay_key}" placeholder="易支付商户密钥">
                </div>
            </div>
        </div>
    </div>
    {/if}

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[status]', ['normal'=>__('Normal'), 'hidden'=>'关闭'], $row['status'])}
        </div>
    </div>

    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
