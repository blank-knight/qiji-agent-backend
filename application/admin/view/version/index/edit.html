<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {:token()}
    <input type="hidden" name="row[id]" value="{$row.id}">

    <div class="form-group">
        <label for="c-version" class="control-label col-xs-12 col-sm-2"><i style="color:red">*</i>当前版本:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-version" data-rule="required" class="form-control" name="row[version]" type="text" value="{$row.version}">
        </div>
    </div>

    <div class="form-group">
        <label for="c-newversion" class="control-label col-xs-12 col-sm-2"><i style="color:red">*</i>新版本号:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-newversion" data-rule="required" class="form-control" name="row[newversion]" type="text" value="{$row.newversion}">
        </div>
    </div>

    <div class="form-group">
        <label for="c-downloadurl" class="control-label col-xs-12 col-sm-2"><i style="color:red">*</i>下载地址:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-downloadurl" data-rule="required" class="form-control" name="row[downloadurl]" type="text" value="{$row.downloadurl}">
        </div>
    </div>

    <div class="form-group">
        <label for="c-requireversion" class="control-label col-xs-12 col-sm-2">要求最低版本:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-requireversion" class="form-control" name="row[requireversion]" type="text" value="{$row.requireversion}">
        </div>
    </div>

    <div class="form-group">
        <label for="c-packagesize" class="control-label col-xs-12 col-sm-2">包大小:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-packagesize" class="form-control" name="row[packagesize]" type="text" value="{$row.packagesize}">
        </div>
    </div>

    <div class="form-group">
        <label for="c-enforce" class="control-label col-xs-12 col-sm-2">强制更新:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[enforce]', ['0'=>'否','1'=>'是'], $row['enforce'])}
        </div>
    </div>

    <div class="form-group">
        <label for="c-upgradetext" class="control-label col-xs-12 col-sm-2">更新说明:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-upgradetext" class="form-control" rows="4" name="row[upgradetext]">{$row.upgradetext}</textarea>
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[status]', ['normal'=>__('Normal'), 'hidden'=>'关闭'], $row['status'])}
        </div>
    </div>

    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
