<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {:token()}

    <div class="form-group">
        <label for="c-newversion" class="control-label col-xs-12 col-sm-2"><i style="color:red">*</i>新版本号:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-newversion" data-rule="required" class="form-control" name="row[newversion]" type="text" value="{$row.newversion|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label for="c-downloadurl" class="control-label col-xs-12 col-sm-2"><i style="color:red">*</i>下载地址:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-downloadurl" data-rule="required;url" class="form-control" name="row[downloadurl]" type="text" value="{$row.downloadurl|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label for="c-packagesize" class="control-label col-xs-12 col-sm-2">包大小:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-packagesize" class="form-control" name="row[packagesize]" type="text" value="{$row.packagesize|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">强制更新:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="radio">
                {foreach name="enforceList" item="vo"}
                <label for="row[enforce]-{$key}"><input id="row[enforce]-{$key}" name="row[enforce]" type="radio" value="{$key}" {eq name="row.enforce" value="$key"}checked{/eq} /> {$vo}</label>
                {/foreach}
            </div>
            <p style="font-size:12px;color:#888;">开启后，低于此版本的客户端必须升级才能继续使用</p>
        </div>
    </div>
    <div class="form-group">
        <label for="c-upgradetext" class="control-label col-xs-12 col-sm-2">更新说明:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-upgradetext" class="form-control" name="row[upgradetext]" rows="4">{$row.upgradetext|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">状态:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="radio">
                {foreach name="statusList" item="vo"}
                <label for="row[status]-{$key}"><input id="row[status]-{$key}" name="row[status]" type="radio" value="{$key}" {eq name="row.status" value="$key"}checked{/eq} /> {$vo}</label>
                {/foreach}
            </div>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
