<style type="text/css">
    .red_color{color:red;margin-right: 5px;}
</style>
<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {:token()}
    <input type="hidden" name="row[id]" value="{$row.id}">

    {if condition="$isSuperAdmin"}
    <div class="form-group">
        <label for="c-agent_id" class="control-label col-xs-12 col-sm-2">上级代理ID:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-agent_id" class="form-control" name="row[agent_id]" type="number" value="{$row.agent_id}" placeholder="0表示直属总后台">
            <p style="margin-top: 5px;font-size: 12px;color:#888;">0是总后台的，填写其他则是对应代理的下级</p>
        </div>
    </div>
    {/if}

    <div class="form-group">
        <label for="c-username" class="control-label col-xs-12 col-sm-2"><i class="red_color">*</i>{:__('Username')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-username" data-rule="required" class="form-control" name="row[username]" type="text" value="{$row['username']}">
        </div>
    </div>

    <div class="form-group">
        <label for="c-password" class="control-label col-xs-12 col-sm-2">{:__('Password')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-password" class="form-control" name="row[password]" type="password" value="" placeholder="留空不修改" autocomplete="new-password" />
        </div>
    </div>

    <div class="form-group">
        <label for="c-nickname" class="control-label col-xs-12 col-sm-2">昵称:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-nickname" class="form-control" name="row[nickname]" type="text" value="{$row['nickname']}" placeholder="昵称">
        </div>
    </div>

    <div class="form-group">
        <label for="c-mobile" class="control-label col-xs-12 col-sm-2">手机号码:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-mobile" data-rule="mobile" class="form-control" name="row[mobile]" type="text" value="{$row['mobile']}" placeholder="手机号码">
        </div>
    </div>

    <div class="form-group">
        <label for="c-email" class="control-label col-xs-12 col-sm-2">邮箱:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-email" class="form-control" name="row[email]" type="email" value="{$row['email']}" placeholder="邮箱">
        </div>
    </div>

    <div class="form-group">
        <label for="c-score" class="control-label col-xs-12 col-sm-2"><i class="red_color">*</i>积分/点数:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-score" data-rule="required" class="form-control" name="row[score]" type="number" value="{$row['score']}" placeholder="积分/点数">
            <p style="margin-top: 5px;font-size: 12px;color:#888;">0为体验模式，大于0为正式模式</p>
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">自定义API Key:</label>
        <div class="col-xs-12 col-sm-8">
            <label class="radio-inline"><input type="radio" name="row[is_custom_key]" value="0" {:$row['is_custom_key']==0?'checked':''}> 继承上级</label>
            <label class="radio-inline"><input type="radio" name="row[is_custom_key]" value="1" {:$row['is_custom_key']==1?'checked':''}> 自定义</label>
            <p style="margin-top: 5px;font-size: 12px;color:#888;">选择"自定义"后，填写下方API Key，该用户将使用自己的Key而非继承上级</p>
        </div>
    </div>

    <div class="form-group" id="custom-key-group" style="{:$row['is_custom_key']==0?'display:none;':''}">
        <label for="c-api-key" class="control-label col-xs-12 col-sm-2">API Key:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-api-key" class="form-control" name="row[api_key_plain]" type="text" value="" placeholder="留空不修改，填写后覆盖">
        </div>
    </div>

    <div class="form-group">
        <label for="c-avatar" class="control-label col-xs-12 col-sm-2">头像:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-avatar" class="form-control" size="50" name="row[avatar]" type="text" value="{$row['avatar']}">
                <div class="input-group-addon no-border no-padding">
                    <span><button type="button" id="faupload-avatar" class="btn btn-danger faupload" data-input-id="c-avatar" data-mimetype="image/gif,image/jpeg,image/png,image/jpg,image/bmp" data-multiple="false" data-preview-id="p-avatar"><i class="fa fa-upload"></i> {:__('Upload')}</button></span>
                </div>
                <span class="msg-box n-right" for="c-avatar"></span>
            </div>
            <ul class="row list-inline faupload-preview" id="p-avatar"></ul>
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[status]', ['normal'=>__('Normal'), 'hidden'=>__('Hidden')],$row['status'])}
        </div>
    </div>

    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>

<script>
$(function() {
    $('input[name="row[is_custom_key]"]').on('change', function() {
        var val = parseInt($(this).val());
        $('#custom-key-group').toggle(val === 1);
    });
});
</script>
