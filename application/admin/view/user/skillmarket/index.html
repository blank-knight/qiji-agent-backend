<div class="panel panel-default panel-intro">
    <div class="panel-heading">
        <div class="panel-lead"><b>技能市场</b>：上架技能 zip 包，客户端「技能市场」页可浏览下载安装。zip 内需含 SKILL.md（根级或一级子目录）</div>
    </div>
    <div class="panel-body">
        <div id="toolbar" class="toolbar btn-toolbar" style="margin-bottom:10px;">
            <button id="btn-add" class="btn btn-primary">+ 上架技能</button>
            <button id="btn-refresh" class="btn btn-default">刷新</button>
        </div>
        <table id="table" class="table table-striped table-bordered table-hover" width="100%"></table>
    </div>
</div>

<!-- 新增/编辑弹窗 -->
<div id="skill-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1050;overflow-y:auto;">
  <div style="background:#fff;max-width:560px;margin:40px auto;border-radius:6px;padding:20px;">
    <h4 id="modal-title" style="margin-top:0;">上架技能</h4>
    <form id="skill-form" enctype="multipart/form-data">
        {:token()}
        <input type="hidden" name="id" id="f-id" value="0">
        <div class="form-group"><label>技能标识（英文）</label><input class="form-control" name="name" id="f-name" placeholder="如 qiji-geo"></div>
        <div class="form-group"><label>技能名称（中文显示）</label><input class="form-control" name="title" id="f-title" placeholder="如 奇计地理编码"></div>
        <div class="form-group"><label>描述</label><textarea class="form-control" name="description" id="f-desc" rows="2"></textarea></div>
        <div class="form-group"><label>分类</label><input class="form-control" name="category" id="f-cat" value="general" placeholder="general / creative / devops ..."></div>
        <div class="form-group"><label>版本号</label><input class="form-control" name="version" id="f-ver" value="1.0.0"></div>
        <div class="form-group"><label>排序权重（大在前）</label><input class="form-control" name="weigh" id="f-weigh" value="0"></div>
        <div class="form-group"><label>状态</label>
            <select class="form-control" name="status" id="f-status">
                <option value="normal">上架</option>
                <option value="hidden">下架</option>
            </select>
        </div>
        <div class="form-group"><label>技能 zip 包（编辑时可留空保留旧文件）</label><input type="file" name="file" id="f-file" accept=".zip"></div>
        <div style="text-align:right;">
            <button type="button" class="btn btn-default" id="btn-cancel">取消</button>
            <button type="button" class="btn btn-primary" id="btn-save">保存</button>
        </div>
    </form>
  </div>
</div>

<script src="/assets/js/backend/user/skillmarket.js"></script>
