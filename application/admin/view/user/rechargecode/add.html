<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {:token()}

    <div class="form-group">
        <label for="c-score" class="control-label col-xs-12 col-sm-2"><i style="color:red">*</i>面值(积分):</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-score" data-rule="required;integer;range(1~)" class="form-control" name="row[score]" type="number" value="100" placeholder="兑换后到账的积分数">
        </div>
    </div>

    <div class="form-group">
        <label for="c-count" class="control-label col-xs-12 col-sm-2"><i style="color:red">*</i>生成数量:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-count" data-rule="required;integer;range(1~500)" class="form-control" name="row[count]" type="number" value="10" placeholder="1-500">
        </div>
    </div>

    <div class="form-group">
        <label for="c-agent" class="control-label col-xs-12 col-sm-2">归属代理:</label>
        <div class="col-xs-12 col-sm-4">
            <select id="c-agent" class="form-control selectpicker" name="row[agent_id]">
                {volist name="agentOptions" id="opt"}
                <option value="{$opt.id}">{$opt.name}</option>
                {/volist}
            </select>
            <p style="margin-top:5px;font-size:12px;color:#888;">「平台通用」码所有用户可兑换；指定代理后仅该代理（含下级）的用户可兑换</p>
        </div>
    </div>

    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">生成</button>
            <button type="reset" class="btn btn-default btn-embossed">重置</button>
        </div>
    </div>
</form>
